[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-dream-blog"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [ { name = "jukanntenn", email = "jukanntenn@outlook.com" } ]
requires-python = ">=3.10,<4"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "django>=5.2,<6",
  "django-allauth>=0.61.1,<0.62",
  "django-anymail[resend]~=10.2",
  "django-constance>=4,<5",
  "django-contrib-comments>=2.2,<3",
  "django-cte>=2,<3",
  "django-dbbackup>=4.1,<5",
  "django-environ>=0.11.2,<0.12",
  "django-extensions>=3.2.3,<4",
  "django-haystack>=3.2.1,<4",
  "django-health-check>=3.18.1,<4",
  "django-hitcount>=1.3.5,<2",
  "django-huey-email>=0.0.1,<0.0.2",
  "django-md-field",
  "django-model-utils>=4.4,<5",
  "django-notifications-hq>=1.8.3,<2",
  "django-ratelimit>=4.1,<5",
  "django-taggit~=5.0",
  "django-tencentcos-storage>=0.2.1,<0.3",
  "django-tree-comments>=0.0.4rc1,<0.1",
  "django-vite>=3.0.3,<4",
  "huey>=2.5,<3",
  "jieba>=0.42.1,<1",
  "markdown>=3.5.2,<4",
  "pygments>=2.17.2,<3",
  "pymdown-extensions~=10.7",
  "sentry-sdk[django]>=1.41,<2",
  "whoosh>=2.7.4,<3",
]

[dependency-groups]
dev = [
  "daphne>=4,<5",
  "django-browser-reload>=1.12.1,<2",
  "django-debug-toolbar>=4.2,<5",
  "django-stubs[compatible-mypy]>=6.0.7",
  "djlint>=1.42.3",
  "factory-boy>=3.3,<4",
  "mypy>=2.3",
  "rich>=13.7.1,<14",
  "ruff>=0.16",
]
test = [
  "coverage[toml]>=7.4.1,<8",
  "django-test-plus>=2.2.3,<3",
  "freezegun>=1.4,<2",
  "pytest>=8.3.5",
  "pytest-cov>=5",
  "pytest-django>=4.5.2",
  "pytest-sugar>=1,<2",
]
production = [ "gunicorn>=21.2,<22", "uvicorn[standard]>=0.30,<1" ]

[tool.hatch]
build.targets.wheel.packages = [ "dream_blog" ]

[tool.uv]
default-groups = [ "dev", "test", "production" ]
sources.django-md-field = { git = "https://github.com/jukanntenn/django-md-field.git", branch = "main" }
sources.django-notifications-hq = { git = "https://github.com/django-notifications/django-notifications" }
sources.django-tencentcos-storage = { git = "https://github.com/jukanntenn/django-tencentcos-storage", branch = "main" }
index = [ { name = "tuna", url = "https://pypi.org/simple", default = true } ]

[tool.djlint]
profile = "django"
use_gitignore = true
indent = 4
max_attribute_length = 70
max_line_length = 120
ignore = "H030,H031,H021,H005,H013,H026,H042"

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4
exclude = [ "**/migrations/", ".local", ".venv", "build", "dist", "node_modules" ]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
lint.select = [
  "A",
  "ASYNC",
  "B",
  "B9",
  "BLE",
  "C4",
  "C90",
  "DJ",
  "E",
  "F",
  "FURB",
  "G",
  "I",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "TC",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "PLR0917", # too many positional arguments (Django views often have many)
  "PLR2004",
  "PT018",
  "PT028",
  "RUF001",  # ambiguous unicode characters (Chinese punctuation)
  "RUF003",  # ambiguous unicode characters in comments
  "RUF043",
]
lint.per-file-ignores."**/admin.py" = [ "RUF012" ]
lint.per-file-ignores."**/forms.py" = [ "RUF012" ]
lint.per-file-ignores."**/models.py" = [ "RUF012" ]
lint.per-file-ignores."**/tests.py" = [
  "BLE001",
  "C400",
  "DJ008",
  "N806",
  "PLR2004",
  "PLW0603",
  "PT",
  "PTH103",
  "PTH118",
  "PTH123",
  "RET504",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF059",
  "S",
  "UP031",
]
lint.per-file-ignores."**/views.py" = [ "RUF012" ]
lint.per-file-ignores."config/settings/*.py" = [ "S104", "S105", "S106" ]
lint.per-file-ignores."dream_blog/**/tests/**" = [
  "BLE001",
  "C400",
  "DJ008",
  "N806",
  "PLR2004",
  "PLW0603",
  "PT",
  "PTH103",
  "PTH118",
  "PTH123",
  "RET504",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF059",
  "S",
  "UP031",
]
lint.per-file-ignores."dream_blog/conftest.py" = [ "S" ]
lint.per-file-ignores."dream_blog/factories.py" = [ "S" ]
lint.per-file-ignores."dream_blog/scripts/**" = [ "S" ]
lint.per-file-ignores."dream_blog/search/backends/**" = [ "PLR0912" ]
lint.per-file-ignores."dream_blog/test_*.py" = [ "PT", "S" ]
lint.per-file-ignores."dream_blog/tests/**" = [
  "BLE001",
  "C400",
  "DJ008",
  "N806",
  "PLR2004",
  "PLW0603",
  "PT",
  "PTH103",
  "PTH118",
  "PTH123",
  "RET504",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF059",
  "S",
  "UP031",
]
lint.per-file-ignores."e2e/**" = [ "S" ]
lint.isort.known-first-party = [ "dream_blog", "config" ]
lint.mccabe.max-complexity = 15
lint.pylint.max-args = 6
lint.pylint.max-branches = 12
lint.pylint.max-positional-args = 5
lint.pylint.max-returns = 8
lint.pylint.max-statements = 60

[tool.mypy]
exclude = '''(?x)(
    ^\.claude/ |
    ^\.codex/  |
    ^\.zcode/
)'''
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
plugins = []
overrides = [
  { module = "dream_blog.*", ignore_errors = true },
  { module = "config.*", ignore_errors = true },
]
no_implicit_optional = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
ini_options.minversion = "8.0"
ini_options.norecursedirs = "frontend"
ini_options.python_files = "tests.py test_*.py"
ini_options.addopts = "-v --tb=short --reuse-db --strict-markers --cov=dream_blog/ --cov-report html"
ini_options.markers = [
  "e2e: end-to-end browser tests (slow, needs docker + playwright)",
]
ini_options.DJANGO_SETTINGS_MODULE = "config.settings.test"

[tool.coverage]
run.omit = [ "*/factories.py", "*/migrations/*", "*/tests/*", "dream_blog/scripts/*" ]
