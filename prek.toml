# prek config (prek native TOML format).
# Usage:
#   prek install              # first time, write git hooks shim
#   git commit ...            # auto-triggered after install
#   prek run --all-files      # manual full run
#   prek run ruff             # run single hook by id
#   SKIP=ruff git commit ...  # skip single hook
#   prek update               # upgrade all revs to latest tag

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "trailing-whitespace", exclude = { glob = "frontend/dist/**" } },
    { id = "end-of-file-fixer", exclude = { glob = "frontend/dist/**" } },
    { id = "check-yaml", args = ["--allow-multiple-documents"] },
    { id = "check-toml" },
    { id = "check-json", exclude = { glob = ["frontend/tsconfig.json", "frontend/dist/**"] } },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
    { id = "ruff", args = ["--fix"], exclude = { glob = ["**/migrations/**", ".claude/**", ".codex/**", ".zcode/**"] } },
    { id = "ruff-format", exclude = { glob = ["**/migrations/**", ".claude/**", ".codex/**", ".zcode/**"] } },
]

[[repos]]
repo = "https://github.com/djlint/djLint"
rev = "v1.42.3"
hooks = [
    { id = "djlint-reformat-django", types = ["html"] },
    { id = "djlint-django", types = ["html"] },
]

[[repos]]
repo = "https://github.com/tox-dev/pyproject-fmt"
rev = "v2.25.3"
hooks = [
    { id = "pyproject-fmt" },
]

[[repos]]
repo = "https://github.com/adamchainz/django-upgrade"
rev = "1.31.1"
hooks = [
    { id = "django-upgrade", args = ["--target-version", "5.2"], exclude = { glob = "**/migrations/**" } },
]



[[repos]]
repo = "local"
hooks = [
    {
        id = "mypy",
        name = "mypy (Django type truth, pinned 2.1.0)",
        language = "system",
        entry = "uv run mypy dream_blog config --strict --config-file=pyproject.toml",
        pass_filenames = false,
        exclude = { glob = ["**/tests/**", "**/migrations/**"] },
    },
    {
        id = "basedpyright",
        name = "basedpyright (primary type checker)",
        language = "system",
        entry = "uv run basedpyright --project pyproject.toml",
        pass_filenames = false,
    },
    {
        id = "makemigrations-check",
        name = "Detect model/migration drift",
        language = "system",
        entry = "uv run python manage.py makemigrations posts tutorials columns comments alerts core donate favorites friendlinks newsletters notify search share tags users webtools --check --dry-run --settings=config.settings.test",
        pass_filenames = false,
    },
    {
        id = "pytest",
        name = "pytest with coverage (pre-push gate)",
        language = "system",
        entry = "uv run pytest -m \"not e2e\" --no-header",
        pass_filenames = false,
        stages = ["pre-push"],
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "agents-claude-sync",
        name = "AGENTS.md / CLAUDE.md in sync",
        language = "system",
        entry = "bash -c 'diff -q AGENTS.md CLAUDE.md || (echo \"AGENTS.md and CLAUDE.md differ — keep them byte-identical\" && exit 1)'",
        pass_filenames = false,
        files = { glob = ["AGENTS.md", "CLAUDE.md"] },
    },
]
