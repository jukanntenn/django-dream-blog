# prek config (prek native TOML format).
# Usage:
#   prek install              # first time, write git hooks shim
#   git commit ...            # auto-triggered after install
#   prek run --all-files      # manual full run
#   prek run ruff             # run single hook by id
#   SKIP=ruff git commit ...  # skip single hook
#   prek update               # upgrade all revs to latest tag

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml", args = ["--allow-multiple-documents"] },
    { id = "check-toml" },
    { id = "check-json", exclude = { glob = "frontend/tsconfig.json" } },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
    { id = "ruff", args = ["--fix"], exclude = { glob = "**/migrations/**" } },
    { id = "ruff-format", exclude = { glob = "**/migrations/**" } },
]

[[repos]]
repo = "https://github.com/djlint/djLint"
rev = "v1.42.3"
hooks = [
    { id = "djlint-reformat-django", types = ["html"] },
    { id = "djlint-django", types = ["html"] },
]

[[repos]]
repo = "https://github.com/tox-dev/pyproject-fmt"
rev = "v2.25.3"
hooks = [
    { id = "pyproject-fmt" },
]

[[repos]]
repo = "https://github.com/adamchainz/django-upgrade"
rev = "1.31.1"
hooks = [
    { id = "django-upgrade", args = ["--target-version", "5.2"], exclude = { glob = "**/migrations/**" } },
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v2.3.0"
hooks = [
    {
        id = "mypy",
        additional_dependencies = ["django-stubs[compatible-mypy]>=6.0.7"],
        args = ["--strict", "--ignore-missing-imports", "--config-file=pyproject.toml"],
        exclude = { glob = ["**/tests/**", "**/migrations/**", ".claude/**", ".codex/**", ".zcode/**"] },
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "agents-claude-sync",
        name = "AGENTS.md / CLAUDE.md in sync",
        language = "system",
        entry = "bash -c 'diff -q AGENTS.md CLAUDE.md || (echo \"AGENTS.md and CLAUDE.md differ — keep them byte-identical\" && exit 1)'",
        pass_filenames = false,
        files = { glob = ["AGENTS.md", "CLAUDE.md"] },
    },
]
