<div class="share-icons inline-flex flex-wrap items-center gap-1.5 mt-2">
  <span class="text-xs text-slate-500 dark:text-slate-400">分享：</span>
  <button
    type="button"
    class="share-icon inline-flex items-center justify-center rounded p-1 text-green-600 hover:bg-slate-100 hover:text-green-700 dark:text-green-400 dark:hover:bg-slate-700 dark:hover:text-green-300 transition"
    data-platform="wechat"
    data-title="{{ entry.title|escape }}"
    data-excerpt="{{ entry.excerpt|default:entry.title|striptags|truncatechars:160|escape }}"
    data-url="{{ request.build_absolute_uri }}"
    aria-label="Share to WeChat"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M8.5 4c-4.418 0-8 3.134-8 7s3.582 7 8 7c.97 0 1.9-.153 2.75-.437L14 19l-1.25-2.875C14.96 15.173 16.5 13.258 16.5 11c0-3.866-3.582-7-8-7zm7.5 8c-3.866 0-7 2.686-7 6s3.134 6 7 6c.78 0 1.53-.11 2.22-.313L20 23l-1-2.28C20.553 19.61 21.5 18.38 21.5 17c0-3.314-3.134-6-7-6z"/>
    </svg>
  </button>
  <button
    type="button"
    class="share-icon inline-flex items-center justify-center rounded p-1 text-red-600 hover:bg-slate-100 hover:text-red-700 dark:text-red-400 dark:hover:bg-slate-700 dark:hover:text-red-300 transition"
    data-platform="xiaohongshu"
    data-title="{{ entry.title|escape }}"
    data-excerpt="{{ entry.excerpt|default:entry.title|striptags|truncatechars:160|escape }}"
    data-url="{{ request.build_absolute_uri }}"
    aria-label="Share to Xiaohongshu"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 6.17L10 14.76 7.41 12.17 6 13.59l4 4 8-8-1.41-1.42z"/>
    </svg>
  </button>
  <button
    type="button"
    class="share-icon inline-flex items-center justify-center rounded p-1 text-yellow-600 hover:bg-slate-100 hover:text-yellow-700 dark:text-yellow-400 dark:hover:bg-slate-700 dark:hover:text-yellow-300 transition"
    data-platform="weibo"
    data-title="{{ entry.title|escape }}"
    data-excerpt="{{ entry.excerpt|default:entry.title|striptags|truncatechars:160|escape }}"
    data-url="{{ request.build_absolute_uri }}"
    aria-label="Share to Weibo"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2Zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4Z"/>
    </svg>
  </button>
</div>
