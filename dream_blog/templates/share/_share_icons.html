{% load static %}
<div class="share-icons inline-flex flex-wrap items-center gap-2 mt-3">
    <span class="text-sm font-medium text-slate-500 dark:text-slate-400">分享：</span>
    <button type="button"
            class="share-icon inline-flex items-center justify-center rounded p-1.5 text-green-600 hover:bg-slate-100 hover:text-green-700 dark:text-green-400 dark:hover:bg-slate-700 dark:hover:text-green-300 transition"
            data-platform="wechat"
            data-title="{{ entry.title|escape }}"
            data-excerpt="{{ entry.excerpt|default:entry.title|striptags|truncatechars:160|escape }}"
            data-url="{{ request.build_absolute_uri }}"
            aria-label="Share to WeChat">
        <span aria-hidden="true"
              class="icon h-5 w-5"
              style="--icon-url: url('{% static 'wechat-fill.svg' %}')"></span>
    </button>
    <button type="button"
            class="share-icon inline-flex items-center justify-center rounded p-1.5 text-red-600 hover:bg-slate-100 hover:text-red-700 dark:text-red-400 dark:hover:bg-slate-700 dark:hover:text-red-300 transition"
            data-platform="xiaohongshu"
            data-title="{{ entry.title|escape }}"
            data-excerpt="{{ entry.excerpt|default:entry.title|striptags|truncatechars:160|escape }}"
            data-url="{{ request.build_absolute_uri }}"
            aria-label="Share to Xiaohongshu">
        <span aria-hidden="true"
              class="icon h-5 w-5"
              style="--icon-url: url('{% static 'xiaohongshu.svg' %}')"></span>
    </button>
    <button type="button"
            class="share-icon inline-flex items-center justify-center rounded p-1.5 text-yellow-600 hover:bg-slate-100 hover:text-yellow-700 dark:text-yellow-400 dark:hover:bg-slate-700 dark:hover:text-yellow-300 transition"
            data-platform="weibo"
            data-title="{{ entry.title|escape }}"
            data-excerpt="{{ entry.excerpt|default:entry.title|striptags|truncatechars:160|escape }}"
            data-url="{{ request.build_absolute_uri }}"
            aria-label="Share to Weibo">
        <span aria-hidden="true"
              class="icon h-5 w-5"
              style="--icon-url: url('{% static 'weibo-fill.svg' %}')"></span>
    </button>
</div>
