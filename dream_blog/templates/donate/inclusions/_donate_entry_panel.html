<div class="mt-8 space-y-4" data-donate-entry-panel>
  <button type="button"
          class="mx-auto block px-6 py-2 rounded-full bg-cyan-600 hover:bg-cyan-700 text-white font-medium transition-colors"
          data-donate-entry-toggle
          aria-expanded="false"
          aria-controls="donate-entry-panel">
    赞赏支持
  </button>

  <div id="donate-entry-panel" hidden data-donate-entry-body>
    <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800">
      {% include "donate/inclusions/_donate_panel.html" %}
      <div class="mt-6 text-center">
        <a class="text-sm text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors"
           href="{% url 'donate:donate' %}">
          打开完整赞助页
        </a>
      </div>
    </div>
  </div>

  <noscript>
    <div class="text-center">
      <a class="inline-block px-6 py-2 rounded-full bg-cyan-600 text-white font-medium"
         href="{% url 'donate:donate' %}">
        赞赏支持
      </a>
    </div>
  </noscript>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    for (const wrapper of document.querySelectorAll("[data-donate-entry-panel]")) {
      const button = wrapper.querySelector("[data-donate-entry-toggle]")
      const body = wrapper.querySelector("[data-donate-entry-body]")
      if (!button || !body) continue

      button.addEventListener("click", () => {
        const isOpen = !body.hasAttribute("hidden")
        if (isOpen) {
          body.setAttribute("hidden", "")
          button.setAttribute("aria-expanded", "false")
        } else {
          body.removeAttribute("hidden")
          button.setAttribute("aria-expanded", "true")
          body.scrollIntoView({ block: "center", behavior: "smooth" })
        }
      })
    }
  })
</script>
